name: Build clients
on:
  workflow_dispatch:
  push:
    branches: [main, feat/hosted-websocket-demo]
    tags: ['v*']
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-15
            platform: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        shell: bash
        run: rustup update stable && rustup default stable
      - name: Validate and compile
        shell: bash
        run: |
          cargo fmt --check
          cargo test --locked
          cargo build --release --locked --bin client
      - name: Package
        shell: bash
        run: |
          mkdir package
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/client.exe package/
            printf '@echo off\r\ncd /d "%%~dp0"\r\nclient.exe\r\npause\r\n' > 'package/Abrir Netlab.bat'
          else
            cp target/release/client package/
            printf '#!/bin/sh\ncd "$(dirname "$0")"\n./client\nprintf "Pulsa Enter para cerrar..."\nread answer\n' > 'package/Abrir Netlab.command'
            chmod +x 'package/Abrir Netlab.command'
          fi
          cp README.md package/
      - uses: actions/upload-artifact@v4
        with:
          name: netlab-${{ matrix.platform }}
          path: package/
