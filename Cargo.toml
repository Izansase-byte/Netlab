[package]
name = "Netlab"
version = "1.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
rustls-pemfile = "2.2.0"
tokio = { version = "1.54.1", features = ["net", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.6"

futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
