name: Build clients
on:
  workflow_dispatch:
  push:
    branches: [main, feat/hosted-websocket-demo]
    tags: ['v*']
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-15
            platform: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        shell: bash
        run: rustup update stable && rustup default stable
      - name: Validate and compile
        shell: bash
        run: |
          cargo fmt --check
          cargo test --locked
          cargo build --release --locked --bin client
      - name: Package
        shell: bash
        run: |
          mkdir package
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/client.exe package/
            printf '@echo off\r\ncd /d "%%~dp0"\r\nclient.exe\r\npause\r\n' > 'package/Abrir Netlab.bat'
          else
            cp target/release/client package/
            printf '#!/bin/sh\ncd "$(dirname "$0")"\n./client\nprintf "Pulsa Enter para cerrar..."\nread answer\n' > 'package/Abrir Netlab.command'
            chmod +x 'package/Abrir Netlab.command'
          fi
          cp README.md package/
          mkdir archives
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "archives/Netlab-1.1.0-${{ matrix.platform }}.zip" ./package/*
          else
            tar -czf "archives/Netlab-1.1.0-${{ matrix.platform }}.tar.gz" -C package .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: netlab-${{ matrix.platform }}
          path: archives/

  publish:
    needs: client
    if: github.ref == 'refs/heads/feat/hosted-websocket-demo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish v1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Download the client for your system and extract it. No Rust, OpenSSL, certificate files, or server setup is required.

          Windows x64: open "Abrir Netlab.bat".
          Linux x64: run ./client in a terminal.
          macOS: open "Abrir Netlab.command" (unsigned / not notarized).

          The client connects automatically to wss://netlab.izansase-bot.hackclub.app using verified TLS. Enter a username and start chatting. This is a shared public demo; TLS terminates at the hosting proxy, so it is not end-to-end encryption.

          Validation: formatting checks, unit tests and a real two-client WebSocket integration test run on each build platform. The hosted connection was also tested from an Apple Silicon Mac.
          NOTES
          gh release create v1.1.0 release/* --target "$GITHUB_SHA" --title "Netlab 1.1.0 — Hosted chat demo" --notes-file notes.md --latest
